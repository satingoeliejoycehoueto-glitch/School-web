version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: scolargestor
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./backend
    env_file: ./backend/.env.example
    depends_on:
      - db
    ports:
      - "4000:4000"

volumes:
  pgdata:
